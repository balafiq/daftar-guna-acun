<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengurus Tuai Comel 🌱</title>
    <!-- Memuatkan font Quicksand dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Memuatkan Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Konfigurasi Tema Tailwind untuk warna hijau muda -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                    },
                    colors: {
                        matcha: {
                            50: '#f2fcf5',
                            100: '#e1f8e8',
                            200: '#c3efd1',
                            300: '#95e0b0',
                            400: '#5ec986',
                            500: '#39ac65',
                            600: '#28894e',
                            700: '#236c40',
                            800: '#205635',
                            900: '#1b472e',
                        }
                    },
                    boxShadow: {
                        'soft-green': '0 10px 25px -5px rgba(94, 201, 134, 0.2), 0 8px 10px -6px rgba(94, 201, 134, 0.1)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Gaya tambahan untuk animasi dan kelancaran */
        body {
            background-color: #f2fcf5; /* matcha-50 */
            background-image: radial-gradient(#e1f8e8 1px, transparent 1px); /* corak titik comel */
            background-size: 20px 20px;
        }
        
        .cute-input {
            transition: all 0.3s ease;
        }
        
        .cute-input:focus {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(94, 201, 134, 0.2);
        }

        .ready-pulse {
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(57, 172, 101, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(57, 172, 101, 0); }
            100% { box-shadow: 0 0 0 0 rgba(57, 172, 101, 0); }
        }
    </style>
</head>
<body class="text-matcha-900 min-h-screen p-4 md:p-8 font-sans selection:bg-matcha-300 selection:text-matcha-900">

    <div class="max-w-6xl mx-auto">
        <!-- Pengepala Aplikasi -->
        <header class="text-center mb-10 mt-4">
            <div class="inline-block bg-white px-6 py-3 rounded-full shadow-soft-green mb-4 border border-matcha-100">
                <h1 class="text-3xl md:text-4xl font-bold text-matcha-600 flex items-center justify-center gap-3">
                    <span>🌱</span> Pengurus Tuai <span>🚜</span>
                </h1>
            </div>
            <p class="text-matcha-700 font-medium">Jejaki masa menuai tanaman anda dengan mudah & selamat! 🍏</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Bahagian Borang -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-[2rem] p-6 md:p-8 shadow-soft-green border border-matcha-100 relative overflow-hidden">
                    <!-- Hiasan latar belakang -->
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-matcha-100 rounded-full opacity-50"></div>
                    
                    <h2 class="text-xl font-bold mb-6 text-matcha-800 relative z-10 flex items-center gap-2">
                        <span>📝</span> Tambah Tanaman Baru
                    </h2>
                    
                    <form id="harvestForm" class="space-y-5 relative z-10">
                        <div>
                            <label for="cropName" class="block text-sm font-semibold text-matcha-700 mb-2">Jenis Tanaman 🥬</label>
                            <input type="text" id="cropName" required placeholder="Cth: Cili Padi, Bayam..." 
                                class="cute-input w-full px-4 py-3 rounded-2xl border-2 border-matcha-100 bg-matcha-50 focus:outline-none focus:border-matcha-400 text-matcha-800 placeholder-matcha-300">
                        </div>
                        
                        <div>
                            <label for="sprayDate" class="block text-sm font-semibold text-matcha-700 mb-2">Tarikh & Masa Meracun 💦</label>
                            <input type="datetime-local" id="sprayDate" required 
                                class="cute-input w-full px-4 py-3 rounded-2xl border-2 border-matcha-100 bg-matcha-50 focus:outline-none focus:border-matcha-400 text-matcha-800">
                        </div>
                        
                        <div>
                            <label for="safeDays" class="block text-sm font-semibold text-matcha-700 mb-2">Tempoh Larangan Menuai (Hari) ⏳</label>
                            <input type="number" id="safeDays" required min="0" step="1" placeholder="Cth: 14" 
                                class="cute-input w-full px-4 py-3 rounded-2xl border-2 border-matcha-100 bg-matcha-50 focus:outline-none focus:border-matcha-400 text-matcha-800 placeholder-matcha-300">
                        </div>
                        
                        <button type="submit" 
                            class="w-full mt-4 bg-matcha-500 hover:bg-matcha-400 text-white font-bold py-4 px-6 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 active:translate-y-0 flex justify-center items-center gap-2 text-lg">
                            Kira Tempoh Tuai ✨
                        </button>
                    </form>

                    <button type="button" id="notifyBtn"
                        class="w-full mt-4 bg-white border-2 border-matcha-200 text-matcha-600 font-semibold py-3 px-6 rounded-2xl hover:bg-matcha-50 transition-colors disabled:opacity-60 disabled:cursor-default relative z-10">
                        Hidupkan Notifikasi 🔔
                    </button>
                    <p class="text-xs text-matcha-500 mt-2 text-center relative z-10">Notifikasi hanya muncul selagi page ini dibuka.</p>
                </div>
            </div>

            <!-- Bahagian Dashboard Kad -->
            <div class="lg:col-span-2">
                <div id="emptyState" class="h-full min-h-[300px] flex flex-col items-center justify-center bg-white/60 backdrop-blur-sm rounded-[2rem] border-2 border-dashed border-matcha-200 p-8 text-center transition-all duration-500">
                    <div class="text-6xl mb-4">🪴</div>
                    <h3 class="text-xl font-bold text-matcha-600 mb-2">Belum ada tanaman dijejaki</h3>
                    <p class="text-matcha-500">Sila masukkan maklumat di sebelah untuk bermula!</p>
                </div>
                
                <div id="dashboardGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
                    <!-- Kad-kad tanaman akan dijana di sini melalui JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data tanaman disimpan dalam LocalStorage supaya kekal selepas refresh
        const STORAGE_KEY = 'pengurusTuai.crops';
        let cropsData = loadCrops();

        // Elemen DOM
        const form = document.getElementById('harvestForm');
        const dashboardGrid = document.getElementById('dashboardGrid');
        const emptyState = document.getElementById('emptyState');
        const notifyBtn = document.getElementById('notifyBtn');

        function loadCrops() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                return Array.isArray(saved) ? saved : [];
            } catch (e) {
                return [];
            }
        }

        function saveCrops() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(cropsData));
            } catch (e) {
                // LocalStorage mungkin disekat (cth: mod peribadi); app masih berfungsi tanpa simpanan
            }
        }

        // Elak teks pengguna dibaca sebagai HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Fungsi format tarikh ke BM
        function formatDate(dateString) {
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            return new Date(dateString).toLocaleDateString('ms-MY', options);
        }

        // ---- Notifikasi ----
        function notificationsSupported() {
            return 'Notification' in window;
        }

        function updateNotifyButton() {
            if (!notificationsSupported()) {
                notifyBtn.textContent = 'Notifikasi tidak disokong pelayar ini 🚫';
                notifyBtn.disabled = true;
            } else if (Notification.permission === 'granted') {
                notifyBtn.textContent = 'Notifikasi dihidupkan 🔔';
                notifyBtn.disabled = true;
            } else if (Notification.permission === 'denied') {
                notifyBtn.textContent = 'Notifikasi disekat dalam tetapan pelayar 🔕';
                notifyBtn.disabled = true;
            } else {
                notifyBtn.textContent = 'Hidupkan Notifikasi 🔔';
                notifyBtn.disabled = false;
            }
        }

        notifyBtn.addEventListener('click', function() {
            if (!notificationsSupported()) return;
            Notification.requestPermission().then(updateNotifyButton);
        });

        function notifyReady(crop) {
            if (!notificationsSupported() || Notification.permission !== 'granted') return;
            try {
                new Notification('Sedia untuk dituai! ✅', {
                    body: crop.name + ' sudah melepasi tempoh larangan menuai.',
                    tag: 'tuai-' + crop.id
                });
            } catch (e) {
                // Sesetengah pelayar mudah alih hanya benarkan notifikasi melalui service worker
            }
        }

        // Fungsi mengendalikan submit borang
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('cropName').value.trim();
            const sprayDateStr = document.getElementById('sprayDate').value;
            const safeDays = parseInt(document.getElementById('safeDays').value);

            if(!name || !sprayDateStr || isNaN(safeDays)) return;

            // Kira tarikh menuai (tambah milisaat)
            const sprayTime = new Date(sprayDateStr).getTime();
            const safeDaysMs = safeDays * 24 * 60 * 60 * 1000;
            const harvestTime = sprayTime + safeDaysMs;

            const newCrop = {
                id: Date.now().toString(), // ID unik
                name: name,
                harvestTime: harvestTime,
                harvestDateStr: new Date(harvestTime).toISOString(),
                // Tanaman yang sudah sedia semasa ditambah tidak perlu dinotifikasi
                notified: harvestTime <= Date.now()
            };

            cropsData.push(newCrop);
            saveCrops();
            renderCrops();
            
            // Reset form dan berikan fokus semula kepada input pertama
            form.reset();
            document.getElementById('cropName').focus();
        });

        // Fungsi untuk membina dan memaparkan kad tanaman
        function renderCrops() {
            // Uruskan keterlihatan 'empty state' vs grid
            if (cropsData.length > 0) {
                emptyState.classList.add('hidden');
                dashboardGrid.classList.remove('hidden');
            } else {
                emptyState.classList.remove('hidden');
                dashboardGrid.classList.add('hidden');
            }

            // Kosongkan grid sebelum render semula
            dashboardGrid.innerHTML = '';

            // Bina setiap kad
            cropsData.forEach(crop => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-[2rem] p-6 shadow-soft-green border border-matcha-100 flex flex-col justify-between relative overflow-hidden transition-all duration-300 transform hover:scale-[1.02]";
                
                // Elemen UI Kad
                card.innerHTML = `
                    <div class="absolute -bottom-6 -right-6 text-8xl opacity-10 pointer-events-none">🌿</div>
                    
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-2xl font-bold text-matcha-800 drop-shadow-sm break-words min-w-0">${escapeHtml(crop.name)}</h3>
                            <button type="button" data-remove-id="${escapeHtml(crop.id)}" class="text-matcha-300 hover:text-red-400 transition-colors rounded-full p-1 hover:bg-red-50" title="Padam">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                        
                        <div class="bg-matcha-50 rounded-2xl p-4 mb-4 border border-matcha-100/50">
                            <p class="text-xs text-matcha-600 font-semibold uppercase tracking-wider mb-1">Tarikh Selamat Dituai</p>
                            <p class="text-sm font-bold text-matcha-900">${formatDate(crop.harvestDateStr)}</p>
                        </div>
                    </div>

                    <div class="mt-auto">
                        <p class="text-xs text-center text-matcha-600 font-bold mb-2">BAKI MASA: ⏱️</p>
                        <!-- Container untuk Countdown -->
                        <div class="countdown-container flex justify-between gap-2" data-id="${escapeHtml(crop.id)}" data-target="${Number(crop.harvestTime)}">
                            <div class="flex-1 bg-white border-2 border-matcha-100 rounded-xl p-2 text-center shadow-sm">
                                <div class="days text-xl font-bold text-matcha-600">00</div>
                                <div class="text-[0.65rem] text-matcha-400 font-bold uppercase">Hari</div>
                            </div>
                            <div class="flex-1 bg-white border-2 border-matcha-100 rounded-xl p-2 text-center shadow-sm">
                                <div class="hours text-xl font-bold text-matcha-600">00</div>
                                <div class="text-[0.65rem] text-matcha-400 font-bold uppercase">Jam</div>
                            </div>
                            <div class="flex-1 bg-white border-2 border-matcha-100 rounded-xl p-2 text-center shadow-sm">
                                <div class="minutes text-xl font-bold text-matcha-600">00</div>
                                <div class="text-[0.65rem] text-matcha-400 font-bold uppercase">Minit</div>
                            </div>
                            <div class="flex-1 bg-white border-2 border-matcha-100 rounded-xl p-2 text-center shadow-sm">
                                <div class="seconds text-xl font-bold text-matcha-600">00</div>
                                <div class="text-[0.65rem] text-matcha-400 font-bold uppercase">Saat</div>
                            </div>
                        </div>
                        <!-- Container Mesej Sedia -->
                        <div class="ready-message hidden mt-3 bg-green-500 text-white text-center py-3 rounded-xl font-bold text-lg ready-pulse shadow-md border-2 border-green-400">
                            Sedia untuk dituai! ✅
                        </div>
                    </div>
                `;
                dashboardGrid.appendChild(card);
            });

            // Jalankan update segera supaya tidak perlu tunggu 1 saat pertama
            updateCountdowns();
        }

        // Butang padam (guna delegasi, bukan onclick dalam HTML)
        dashboardGrid.addEventListener('click', function(e) {
            const btn = e.target.closest('[data-remove-id]');
            if (!btn) return;
            const id = btn.getAttribute('data-remove-id');
            cropsData = cropsData.filter(crop => crop.id !== id);
            saveCrops();
            renderCrops();
        });

        // Fungsi utama mengemaskini masa setiap saat
        function updateCountdowns() {
            const containers = document.querySelectorAll('.countdown-container');
            const now = new Date().getTime();
            let changed = false;

            containers.forEach(container => {
                const target = parseInt(container.getAttribute('data-target'));
                const distance = target - now;

                const readyMsg = container.nextElementSibling; // div.ready-message

                if (distance <= 0) {
                    // Masa tamat
                    container.classList.add('hidden');
                    readyMsg.classList.remove('hidden');

                    const crop = cropsData.find(c => c.id === container.getAttribute('data-id'));
                    if (crop && !crop.notified) {
                        notifyReady(crop);
                        crop.notified = true;
                        changed = true;
                    }
                } else {
                    // Kira d, h, m, s
                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    // Kemaskini DOM
                    container.querySelector('.days').innerText = days.toString().padStart(2, '0');
                    container.querySelector('.hours').innerText = hours.toString().padStart(2, '0');
                    container.querySelector('.minutes').innerText = minutes.toString().padStart(2, '0');
                    container.querySelector('.seconds').innerText = seconds.toString().padStart(2, '0');
                    
                    // Pastikan ia kelihatan jika masa belum tamat
                    container.classList.remove('hidden');
                    readyMsg.classList.add('hidden');
                }
            });

            if (changed) saveCrops();
        }

        // Paparan awal daripada data tersimpan
        updateNotifyButton();
        renderCrops();

        // Kemaskini setiap saat (1000ms)
        setInterval(updateCountdowns, 1000);
    </script>
</body>
</html>

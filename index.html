<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengurus Tuai 🌱</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                        display: ['Fredoka', 'Quicksand', 'sans-serif'],
                    },
                    colors: {
                        // Latar krim lembut
                        cream: { 50: '#fffdf8', 100: '#fff8ec', 200: '#fdefd8' },
                        // Hijau matcha (warna utama)
                        matcha: {
                            50: '#f1faf3', 100: '#ddf3e2', 200: '#bce6c7', 300: '#8fd3a3',
                            400: '#62bd7f', 500: '#43a263', 600: '#33834e', 700: '#2b6841',
                            800: '#255337', 900: '#1f452f',
                        },
                        // Pic (aksen)
                        peach: { 50: '#fff4f0', 100: '#ffe6dd', 200: '#ffcbbb', 300: '#ffa98f', 400: '#f98667', 500: '#ea6a49' },
                        // Kuning mentega (hampir sedia)
                        butter: { 50: '#fffbea', 100: '#fff3c4', 200: '#ffe78f', 300: '#fcd45a', 400: '#f2bd2c', 500: '#c99412' },
                    },
                    boxShadow: {
                        'soft': '0 12px 30px -12px rgba(67, 162, 99, 0.28), 0 4px 10px -6px rgba(67, 162, 99, 0.12)',
                        'soft-lg': '0 22px 45px -18px rgba(67, 162, 99, 0.35), 0 6px 14px -8px rgba(67, 162, 99, 0.15)',
                        'peach': '0 12px 28px -12px rgba(234, 106, 73, 0.35)',
                    },
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #fff8ec;
            background-image:
                radial-gradient(circle at 10% 0%, rgba(188, 230, 199, 0.55) 0, transparent 38%),
                radial-gradient(circle at 95% 15%, rgba(255, 203, 187, 0.45) 0, transparent 32%),
                radial-gradient(circle at 50% 100%, rgba(255, 231, 143, 0.35) 0, transparent 40%),
                radial-gradient(rgba(67, 162, 99, 0.10) 1.2px, transparent 1.2px);
            background-size: auto, auto, auto, 22px 22px;
            background-attachment: fixed;
        }

        /* Emoji beranimasi */
        .emoji { display: inline-block; vertical-align: middle; object-fit: contain; user-select: none; }
        .emoji-text { display: inline-flex; align-items: center; justify-content: center; line-height: 1; vertical-align: middle; }

        /* Input comel */
        .cute-input { transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease, background-color .25s ease; }
        .cute-input:focus { outline: none; transform: translateY(-1px); background-color: #fff; border-color: #8fd3a3; box-shadow: 0 0 0 4px rgba(143, 211, 163, 0.30); }

        /* Animasi */
        @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
        @keyframes drift { 0% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(14px, -10px) rotate(6deg); } 50% { transform: translate(28px, 2px) rotate(-4deg); } 75% { transform: translate(10px, 10px) rotate(4deg); } 100% { transform: translate(0, 0) rotate(0deg); } }
        @keyframes pop-in { 0% { opacity: 0; transform: translateY(14px) scale(.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes pop-out { to { opacity: 0; transform: scale(.9) translateY(8px); } }
        @keyframes tick { 0% { transform: translateY(-3px); opacity: .4; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(67, 162, 99, .35); } 50% { box-shadow: 0 0 0 10px rgba(67, 162, 99, 0); } }
        @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }
        @keyframes stripes { from { background-position: 0 0; } to { background-position: 24px 0; } }

        .floaty { animation: floaty 3.6s ease-in-out infinite; }
        .drift { animation: drift 14s ease-in-out infinite; }
        .pop-in { animation: pop-in .45s cubic-bezier(.2, .9, .3, 1.2) both; }
        .pop-out { animation: pop-out .3s ease forwards; }
        .tick { animation: tick .3s ease; }
        .glow { animation: glow 2.2s ease-in-out infinite; }
        .toast-in { animation: toast-in .35s cubic-bezier(.2, .9, .3, 1.2) both; }
        .progress-stripes {
            background-image: linear-gradient(45deg, rgba(255,255,255,.28) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.28) 50%, rgba(255,255,255,.28) 75%, transparent 75%, transparent);
            background-size: 24px 24px;
            animation: stripes 1.2s linear infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            .floaty, .drift, .pop-in, .tick, .glow, .toast-in, .progress-stripes { animation: none !important; }
        }

        /* Ikon kalendar input tarikh berwarna hijau */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator { opacity: .6; cursor: pointer; }
    </style>
</head>
<body class="text-matcha-900 min-h-screen font-sans selection:bg-matcha-200 selection:text-matcha-900 overflow-x-hidden">

    <!-- Hiasan terbang -->
    <div class="pointer-events-none fixed inset-0 -z-0 overflow-hidden" aria-hidden="true">
        <div class="absolute top-24 left-[6%] drift opacity-80 hidden md:block" data-emoji="1f98b" data-char="🦋" data-size="40"></div>
        <div class="absolute top-[55%] right-[5%] drift opacity-80 hidden md:block" style="animation-delay:-5s" data-emoji="1f41d" data-char="🐝" data-size="34"></div>
        <div class="absolute bottom-10 left-[12%] drift opacity-70 hidden md:block" style="animation-delay:-9s" data-emoji="1f343" data-char="🍃" data-size="34"></div>
    </div>

    <div class="relative z-10 max-w-6xl mx-auto px-4 py-6 md:px-8 md:py-10">

        <!-- Pengepala -->
        <header class="text-center mb-8 md:mb-10">
            <div class="inline-flex items-center gap-3 bg-white/90 backdrop-blur px-6 py-3 md:px-8 md:py-4 rounded-full shadow-soft border-2 border-matcha-100">
                <span class="floaty" data-emoji="1f331" data-char="🌱" data-size="44"></span>
                <h1 class="font-display text-3xl md:text-5xl font-bold text-matcha-600 tracking-tight">Pengurus Tuai</h1>
                <span class="floaty" style="animation-delay:-1.8s" data-emoji="1f69c" data-char="🚜" data-size="44"></span>
            </div>
            <p class="mt-4 text-matcha-700 font-semibold text-base md:text-lg flex items-center justify-center gap-2">
                Jejaki masa menuai tanaman dengan mudah &amp; selamat
                <span data-emoji="1f340" data-char="🍀" data-size="26"></span>
            </p>
        </header>

        <!-- Ringkasan -->
        <section id="stats" class="grid grid-cols-3 gap-3 md:gap-4 mb-6 md:mb-8 max-w-xl mx-auto" aria-label="Ringkasan">
            <div class="bg-white/90 rounded-3xl border-2 border-matcha-100 shadow-soft px-3 py-3 text-center">
                <div class="flex justify-center mb-1" data-emoji="1f96c" data-char="🥬" data-size="28"></div>
                <div id="statTotal" class="font-display text-2xl font-bold text-matcha-700">0</div>
                <div class="text-[0.7rem] font-bold uppercase tracking-wider text-matcha-500">Tanaman</div>
            </div>
            <div class="bg-white/90 rounded-3xl border-2 border-butter-100 shadow-soft px-3 py-3 text-center">
                <div class="flex justify-center mb-1" data-emoji="23f3" data-char="⏳" data-size="28"></div>
                <div id="statWaiting" class="font-display text-2xl font-bold text-butter-500">0</div>
                <div class="text-[0.7rem] font-bold uppercase tracking-wider text-butter-500">Menunggu</div>
            </div>
            <div class="bg-white/90 rounded-3xl border-2 border-matcha-200 shadow-soft px-3 py-3 text-center">
                <div class="flex justify-center mb-1" data-emoji="2705" data-char="✅" data-size="28"></div>
                <div id="statReady" class="font-display text-2xl font-bold text-matcha-600">0</div>
                <div class="text-[0.7rem] font-bold uppercase tracking-wider text-matcha-500">Sedia</div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8 items-start">

            <!-- Borang -->
            <aside class="lg:col-span-1 lg:sticky lg:top-6">
                <div class="bg-white rounded-[2rem] p-6 md:p-7 shadow-soft-lg border-2 border-matcha-100 relative overflow-hidden">
                    <div class="absolute -top-12 -right-12 w-36 h-36 bg-peach-100 rounded-full" aria-hidden="true"></div>
                    <div class="absolute -bottom-16 -left-10 w-32 h-32 bg-matcha-50 rounded-full" aria-hidden="true"></div>

                    <h2 class="relative font-display text-xl md:text-2xl font-bold mb-6 text-matcha-800 flex items-center gap-2">
                        <span data-emoji="1f337" data-char="🌷" data-size="32"></span>
                        Tambah Tanaman
                    </h2>

                    <form id="harvestForm" class="relative space-y-5">
                        <div>
                            <label for="cropName" class="flex items-center gap-1.5 text-sm font-bold text-matcha-700 mb-2">
                                <span data-emoji="1f96c" data-char="🥬" data-size="22"></span> Jenis Tanaman
                            </label>
                            <input type="text" id="cropName" required maxlength="40" autocomplete="off" placeholder="Cth: Cili Padi, Bayam..."
                                class="cute-input w-full px-4 py-3 rounded-2xl border-2 border-matcha-100 bg-matcha-50/70 text-matcha-800 font-semibold placeholder:text-matcha-300 placeholder:font-medium">
                        </div>

                        <div>
                            <label for="sprayDate" class="flex items-center gap-1.5 text-sm font-bold text-matcha-700 mb-2">
                                <span data-emoji="1f327_fe0f" data-char="🌧️" data-size="22"></span> Tarikh &amp; Masa Meracun
                            </label>
                            <input type="datetime-local" id="sprayDate" required
                                class="cute-input w-full px-4 py-3 rounded-2xl border-2 border-matcha-100 bg-matcha-50/70 text-matcha-800 font-semibold">
                        </div>

                        <div>
                            <label for="safeDays" class="flex items-center gap-1.5 text-sm font-bold text-matcha-700 mb-2">
                                <span data-emoji="23f3" data-char="⏳" data-size="22"></span> Tempoh Larangan Menuai
                            </label>
                            <div class="relative">
                                <input type="number" id="safeDays" required min="0" max="365" step="1" inputmode="numeric" placeholder="Cth: 14"
                                    class="cute-input w-full pl-4 pr-16 py-3 rounded-2xl border-2 border-matcha-100 bg-matcha-50/70 text-matcha-800 font-semibold placeholder:text-matcha-300 placeholder:font-medium">
                                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-bold text-matcha-400 pointer-events-none">hari</span>
                            </div>
                            <div class="flex flex-wrap gap-2 mt-2.5" id="dayPresets">
                                <button type="button" data-days="3" class="px-3 py-1 rounded-full text-xs font-bold bg-cream-100 text-matcha-700 border border-matcha-100 hover:bg-matcha-100 transition-colors">3 hari</button>
                                <button type="button" data-days="7" class="px-3 py-1 rounded-full text-xs font-bold bg-cream-100 text-matcha-700 border border-matcha-100 hover:bg-matcha-100 transition-colors">7 hari</button>
                                <button type="button" data-days="14" class="px-3 py-1 rounded-full text-xs font-bold bg-cream-100 text-matcha-700 border border-matcha-100 hover:bg-matcha-100 transition-colors">14 hari</button>
                                <button type="button" data-days="21" class="px-3 py-1 rounded-full text-xs font-bold bg-cream-100 text-matcha-700 border border-matcha-100 hover:bg-matcha-100 transition-colors">21 hari</button>
                            </div>
                        </div>

                        <button type="submit"
                            class="group w-full !mt-6 bg-matcha-500 hover:bg-matcha-600 text-white font-display font-semibold py-3.5 px-6 rounded-2xl shadow-soft hover:shadow-soft-lg transition-all duration-300 hover:-translate-y-0.5 active:translate-y-0 flex justify-center items-center gap-2 text-lg">
                            Kira Tempoh Tuai
                            <span class="transition-transform group-hover:scale-125" data-emoji="2728" data-char="✨" data-size="26"></span>
                        </button>
                    </form>

                    <div class="relative mt-5 pt-5 border-t-2 border-dashed border-matcha-100">
                        <button type="button" id="notifyBtn"
                            class="w-full flex items-center justify-center gap-2 bg-peach-50 border-2 border-peach-200 text-peach-500 font-bold py-2.5 px-4 rounded-2xl hover:bg-peach-100 transition-colors disabled:cursor-default disabled:hover:bg-peach-50">
                            <span data-emoji="1f514" data-char="🔔" data-size="22"></span>
                            <span id="notifyLabel">Hidupkan Notifikasi</span>
                        </button>
                        <p class="text-xs text-matcha-500 mt-2 text-center font-semibold">Notifikasi hanya muncul selagi page ini dibuka.</p>
                    </div>
                </div>
            </aside>

            <!-- Senarai kad -->
            <main class="lg:col-span-2">
                <div id="emptyState" class="min-h-[340px] flex flex-col items-center justify-center bg-white/70 backdrop-blur-sm rounded-[2rem] border-[3px] border-dashed border-matcha-200 p-8 text-center">
                    <div class="floaty mb-3" data-emoji="1f331" data-char="🌱" data-size="96"></div>
                    <h3 class="font-display text-2xl font-bold text-matcha-600 mb-2">Belum ada tanaman dijejaki</h3>
                    <p class="text-matcha-500 font-semibold">Isi borang untuk mula mengira tempoh tuai!</p>
                </div>

                <div id="dashboardGrid" class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6 hidden"></div>
            </main>
        </div>

        <footer class="text-center mt-12 text-sm font-semibold text-matcha-500 flex items-center justify-center gap-2">
            Selamat berkebun! <span data-emoji="1f970" data-char="🥰" data-size="22"></span>
        </footer>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-matcha-700 text-white font-bold px-5 py-3 rounded-full shadow-soft-lg flex items-center gap-2 whitespace-nowrap" role="status" aria-live="polite"></div>

    <script>
        // ---------- Emoji beranimasi (Noto Animated Emoji dari Google) ----------
        const EMOJI_BASE = 'https://fonts.gstatic.com/s/e/notoemoji/latest/';
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function emojiHtml(code, char, size) {
            if (reduceMotion) {
                return `<span class="emoji-text" style="font-size:${size * 0.82}px;width:${size}px;height:${size}px">${char}</span>`;
            }
            return `<img class="emoji" src="${EMOJI_BASE}${code}/512.webp" alt="${char}" width="${size}" height="${size}" loading="lazy" decoding="async" data-fallback="${char}">`;
        }

        // Tukar semua [data-emoji] kepada emoji beranimasi
        function hydrateEmoji(root) {
            root.querySelectorAll('[data-emoji]').forEach(el => {
                el.innerHTML = emojiHtml(el.dataset.emoji, el.dataset.char, Number(el.dataset.size || 24));
                el.removeAttribute('data-emoji');
            });
        }

        // Jika imej gagal dimuatkan, guna emoji biasa
        document.addEventListener('error', function(e) {
            const img = e.target;
            if (img.tagName !== 'IMG' || !img.dataset.fallback) return;
            const span = document.createElement('span');
            span.className = 'emoji-text';
            const size = Number(img.getAttribute('width')) || 24;
            span.style.cssText = `font-size:${size * 0.82}px;width:${size}px;height:${size}px`;
            span.textContent = img.dataset.fallback;
            img.replaceWith(span);
        }, true);

        hydrateEmoji(document);

        // ---------- Data ----------
        const STORAGE_KEY = 'pengurusTuai.crops';
        const DAY_MS = 24 * 60 * 60 * 1000;
        const SOON_MS = DAY_MS; // < 24 jam dikira "hampir sedia"
        let cropsData = loadCrops();

        const form = document.getElementById('harvestForm');
        const dashboardGrid = document.getElementById('dashboardGrid');
        const emptyState = document.getElementById('emptyState');
        const notifyBtn = document.getElementById('notifyBtn');
        const notifyLabel = document.getElementById('notifyLabel');
        const toast = document.getElementById('toast');

        // Ikon tanaman ikut nama (emoji beranimasi yang tersedia)
        const CROP_ICONS = [
            // Cili tiada versi animasi, jadi guna emoji biasa (code: null)
            { match: /(cili|lada|chili)/i, code: null, char: '🌶️', bg: 'bg-peach-100' },
            { match: /(bunga|orkid|ros)/i, code: '1f337', char: '🌷', bg: 'bg-peach-100' },
            { match: /(cendawan|kulat)/i, code: '1f344', char: '🍄', bg: 'bg-peach-100' },
            { match: /(bayam|sawi|kangkung|kobis|salad|pucuk|ulam|daun)/i, code: '1f96c', char: '🥬', bg: 'bg-matcha-100' },
            { match: /(herba|serai|pudina|kesum|selasih)/i, code: '1f33f', char: '🌿', bg: 'bg-matcha-100' },
        ];

        function cropIcon(name) {
            const found = CROP_ICONS.find(i => i.match.test(name));
            return found || { code: '1f331', char: '🌱', bg: 'bg-matcha-100' };
        }

        function iconHtml(icon, size) {
            if (!icon.code) {
                return `<span class="emoji-text" style="font-size:${size * 0.82}px;width:${size}px;height:${size}px">${icon.char}</span>`;
            }
            return emojiHtml(icon.code, icon.char, size);
        }

        function loadCrops() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                return Array.isArray(saved) ? saved : [];
            } catch (e) {
                return [];
            }
        }

        function saveCrops() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(cropsData));
            } catch (e) {
                // LocalStorage mungkin disekat; app masih berfungsi tanpa simpanan
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        function formatDate(ms) {
            return new Date(ms).toLocaleDateString('ms-MY', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
            });
        }

        function formatTime(ms) {
            return new Date(ms).toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
        }

        function formatShort(ms) {
            return new Date(ms).toLocaleDateString('ms-MY', { day: 'numeric', month: 'short' }) + ', ' + formatTime(ms);
        }

        function statusOf(crop, now) {
            const left = crop.harvestTime - now;
            if (left <= 0) return 'ready';
            if (left <= SOON_MS) return 'soon';
            return 'waiting';
        }

        // ---------- Toast ----------
        let toastTimer;
        function showToast(html) {
            toast.innerHTML = html;
            toast.classList.remove('hidden', 'toast-in');
            void toast.offsetWidth;
            toast.classList.add('toast-in');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.add('hidden'), 2600);
        }

        // ---------- Notifikasi ----------
        function notificationsSupported() {
            return 'Notification' in window;
        }

        function updateNotifyButton() {
            let label, disabled = true;
            if (!notificationsSupported()) label = 'Notifikasi tidak disokong';
            else if (Notification.permission === 'granted') label = 'Notifikasi dihidupkan';
            else if (Notification.permission === 'denied') label = 'Notifikasi disekat oleh pelayar';
            else { label = 'Hidupkan Notifikasi'; disabled = false; }
            notifyLabel.textContent = label;
            notifyBtn.disabled = disabled;
            notifyBtn.classList.toggle('opacity-70', disabled);
        }

        notifyBtn.addEventListener('click', function() {
            if (!notificationsSupported()) return;
            Notification.requestPermission().then(updateNotifyButton);
        });

        function notifyReady(crop) {
            if (!notificationsSupported() || Notification.permission !== 'granted') return;
            try {
                new Notification('Sedia untuk dituai! ✅', {
                    body: crop.name + ' sudah melepasi tempoh larangan menuai.',
                    tag: 'tuai-' + crop.id
                });
            } catch (e) {
                // Sesetengah pelayar mudah alih hanya benarkan notifikasi melalui service worker
            }
        }

        // ---------- Borang ----------
        document.getElementById('dayPresets').addEventListener('click', function(e) {
            const btn = e.target.closest('[data-days]');
            if (!btn) return;
            document.getElementById('safeDays').value = btn.dataset.days;
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('cropName').value.trim();
            const sprayDateStr = document.getElementById('sprayDate').value;
            const safeDays = parseInt(document.getElementById('safeDays').value);

            if (!name || !sprayDateStr || isNaN(safeDays) || safeDays < 0) return;

            const sprayTime = new Date(sprayDateStr).getTime();
            const harvestTime = sprayTime + safeDays * DAY_MS;

            const newCrop = {
                id: Date.now().toString(),
                name: name,
                sprayTime: sprayTime,
                safeDays: safeDays,
                harvestTime: harvestTime,
                harvestDateStr: new Date(harvestTime).toISOString(),
                // Tanaman yang sudah sedia semasa ditambah tidak perlu dinotifikasi
                notified: harvestTime <= Date.now()
            };

            cropsData.push(newCrop);
            saveCrops();
            renderCrops(newCrop.id);
            showToast(`${emojiHtml('1f389', '🎉', 22)} <span>${escapeHtml(name)} ditambah!</span>`);

            form.reset();
            document.getElementById('cropName').focus();
        });

        // ---------- Kad ----------
        function tileHtml(cls, label) {
            return `
                <div class="flex-1 bg-white rounded-2xl py-2 text-center border-2 border-matcha-100">
                    <div class="${cls} font-display text-2xl font-bold text-matcha-700 tabular-nums">00</div>
                    <div class="text-[0.62rem] text-matcha-500 font-bold uppercase tracking-wider">${label}</div>
                </div>`;
        }

        function cardHtml(crop, status) {
            const icon = cropIcon(crop.name);
            const hasSpray = typeof crop.sprayTime === 'number';
            const theme = {
                waiting: { border: 'border-matcha-100', ribbon: 'bg-matcha-300', chipBg: 'bg-matcha-50 text-matcha-700', chip: `${emojiHtml('23f3', '⏳', 18)} Menunggu`, bar: 'bg-matcha-400' },
                soon:    { border: 'border-butter-200', ribbon: 'bg-butter-300', chipBg: 'bg-butter-50 text-butter-500', chip: `${emojiHtml('23f0', '⏰', 18)} Hampir sedia`, bar: 'bg-butter-300' },
                ready:   { border: 'border-matcha-300', ribbon: 'bg-matcha-500', chipBg: 'bg-matcha-500 text-white', chip: `${emojiHtml('2705', '✅', 18)} Sedia`, bar: 'bg-matcha-500' },
            }[status];

            return `
                <div class="h-2 ${theme.ribbon}"></div>
                <div class="p-5 md:p-6 flex flex-col gap-4 flex-1">
                    <div class="flex items-start gap-3">
                        <div class="shrink-0 w-14 h-14 rounded-2xl ${icon.bg} flex items-center justify-center">${iconHtml(icon, 38)}</div>
                        <div class="min-w-0 flex-1">
                            <h3 class="font-display text-xl md:text-2xl font-bold text-matcha-800 leading-tight break-words">${escapeHtml(crop.name)}</h3>
                            <span class="mt-1.5 inline-flex items-center gap-1 text-xs font-bold px-2.5 py-1 rounded-full ${theme.chipBg}">${theme.chip}</span>
                        </div>
                        <button type="button" data-remove-id="${escapeHtml(crop.id)}" title="Padam" aria-label="Padam ${escapeHtml(crop.name)}"
                            class="shrink-0 text-matcha-300 hover:text-peach-500 hover:bg-peach-50 transition-colors rounded-xl p-1.5">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>

                    <div class="bg-cream-50 rounded-2xl px-4 py-3 border-2 border-cream-200">
                        <p class="text-[0.68rem] text-matcha-500 font-bold uppercase tracking-wider">Selamat dituai</p>
                        <p class="text-sm font-bold text-matcha-900 mt-0.5">${formatDate(crop.harvestTime)}</p>
                        <p class="text-sm font-semibold text-matcha-600">pukul ${formatTime(crop.harvestTime)}</p>
                        ${hasSpray ? `<p class="text-xs font-semibold text-matcha-500 mt-2 flex items-center gap-1">${emojiHtml('1f327_fe0f', '🌧️', 16)} Diracun ${formatShort(crop.sprayTime)} · ${crop.safeDays} hari</p>` : ''}
                    </div>

                    ${hasSpray ? `
                    <div>
                        <div class="flex justify-between text-[0.68rem] font-bold text-matcha-500 uppercase tracking-wider mb-1.5">
                            <span>Kemajuan</span><span class="progress-label">0%</span>
                        </div>
                        <div class="h-3 bg-matcha-50 rounded-full overflow-hidden border border-matcha-100">
                            <div class="progress-bar h-full rounded-full ${theme.bar} ${status === 'ready' ? '' : 'progress-stripes'} transition-[width] duration-700" style="width:0%"></div>
                        </div>
                    </div>` : ''}

                    <div class="mt-auto">
                        ${status === 'ready' ? `
                        <div class="glow bg-gradient-to-r from-matcha-400 to-matcha-500 text-white text-center py-3 rounded-2xl font-display font-semibold text-lg flex items-center justify-center gap-2">
                            ${emojiHtml('1f973', '🥳', 30)} Sedia untuk dituai!
                        </div>` : `
                        <div class="countdown flex gap-2">
                            ${tileHtml('days', 'Hari')}
                            ${tileHtml('hours', 'Jam')}
                            ${tileHtml('minutes', 'Minit')}
                            ${tileHtml('seconds', 'Saat')}
                        </div>`}
                    </div>
                </div>`;
        }

        function renderCrops(newId) {
            const now = Date.now();
            const has = cropsData.length > 0;
            emptyState.classList.toggle('hidden', has);
            dashboardGrid.classList.toggle('hidden', !has);

            // Sedia dahulu, kemudian yang paling hampir
            const sorted = [...cropsData].sort((a, b) => {
                const ra = a.harvestTime <= now, rb = b.harvestTime <= now;
                if (ra !== rb) return ra ? -1 : 1;
                return a.harvestTime - b.harvestTime;
            });

            dashboardGrid.innerHTML = '';
            sorted.forEach(crop => {
                const status = statusOf(crop, now);
                const card = document.createElement('article');
                card.dataset.id = crop.id;
                card.dataset.status = status;
                card.className = `crop-card bg-white rounded-[1.75rem] shadow-soft hover:shadow-soft-lg border-2 overflow-hidden flex flex-col transition-shadow duration-300 ${
                    status === 'ready' ? 'border-matcha-300' : status === 'soon' ? 'border-butter-200' : 'border-matcha-100'
                } ${crop.id === newId ? 'pop-in' : ''}`;
                card.innerHTML = cardHtml(crop, status);
                dashboardGrid.appendChild(card);
            });

            updateStats(now);
            updateCountdowns();
        }

        function updateStats(now) {
            const ready = cropsData.filter(c => c.harvestTime <= now).length;
            document.getElementById('statTotal').textContent = cropsData.length;
            document.getElementById('statReady').textContent = ready;
            document.getElementById('statWaiting').textContent = cropsData.length - ready;
        }

        // Padam kad
        dashboardGrid.addEventListener('click', function(e) {
            const btn = e.target.closest('[data-remove-id]');
            if (!btn) return;
            const id = btn.getAttribute('data-remove-id');
            const card = btn.closest('.crop-card');
            const finish = () => {
                cropsData = cropsData.filter(crop => crop.id !== id);
                saveCrops();
                renderCrops();
            };
            if (reduceMotion || !card) return finish();
            card.classList.add('pop-out');
            setTimeout(finish, 280);
        });

        function setDigit(el, value) {
            const text = value.toString().padStart(2, '0');
            if (el.textContent === text) return;
            el.textContent = text;
            el.classList.remove('tick');
            void el.offsetWidth;
            el.classList.add('tick');
        }

        // Kemaskini setiap saat
        function updateCountdowns() {
            const now = Date.now();
            let changed = false;
            let needsRender = false;

            document.querySelectorAll('.crop-card').forEach(card => {
                const crop = cropsData.find(c => c.id === card.dataset.id);
                if (!crop) return;

                const status = statusOf(crop, now);
                if (status !== card.dataset.status) needsRender = true;

                if (status === 'ready' && !crop.notified) {
                    notifyReady(crop);
                    crop.notified = true;
                    changed = true;
                }

                const distance = crop.harvestTime - now;
                const countdown = card.querySelector('.countdown');
                if (countdown && distance > 0) {
                    setDigit(countdown.querySelector('.days'), Math.floor(distance / DAY_MS));
                    setDigit(countdown.querySelector('.hours'), Math.floor((distance % DAY_MS) / 3600000));
                    setDigit(countdown.querySelector('.minutes'), Math.floor((distance % 3600000) / 60000));
                    setDigit(countdown.querySelector('.seconds'), Math.floor((distance % 60000) / 1000));
                }

                const bar = card.querySelector('.progress-bar');
                if (bar && typeof crop.sprayTime === 'number') {
                    const total = crop.harvestTime - crop.sprayTime;
                    const pct = total <= 0 ? 100 : Math.min(100, Math.max(0, ((now - crop.sprayTime) / total) * 100));
                    bar.style.width = pct.toFixed(1) + '%';
                    card.querySelector('.progress-label').textContent = Math.floor(pct) + '%';
                }
            });

            if (changed) saveCrops();
            if (needsRender) renderCrops();
        }

        updateNotifyButton();
        renderCrops();
        setInterval(updateCountdowns, 1000);
    </script>
</body>
</html>
